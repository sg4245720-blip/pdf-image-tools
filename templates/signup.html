<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - docuu.com</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                docuu<span>.com</span>
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your free docuu.com account
            </p>


            {% if message %}

            <div class="auth-message">
                {{ message }}
            </div>

            {% endif %}


            {% if error %}

            <div class="auth-message">
                {{ error }}
            </div>

            {% endif %}


            <form action="/signup"
                  method="POST">

                <!-- CSRF Protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <label>
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
