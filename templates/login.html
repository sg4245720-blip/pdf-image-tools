<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PDF Image Tools</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Login</h1>

            <p class="subtitle">
                Login to access your PDF & Image tools.
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <!-- CSRF Protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            <p class="form-footer">
                Don't have an account?
                <a href="{{ url_for('signup') }}">Create Account</a>
            </p>

            <p class="form-footer">
                <a href="{{ url_for('home') }}">← Back to Home</a>
            </p>

        </div>

    </div>

</body>
</html>
